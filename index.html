<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FR Fliesen Rechteck</title>
<link rel="apple-touch-icon" href="fr-icon.png">
<style>
body{font-family:-apple-system,Arial,sans-serif;background:#f4f5f7;margin:0;color:#222}
.app{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px}
.head{border-top:6px solid #c92d29}
.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#c92d29;color:#fff;font-size:18px;font-weight:700;margin:7px 0}
.outline{background:#fff;color:#c92d29;border:2px solid #c92d29}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}
.tab{white-space:nowrap;background:#fff;border:0;border-radius:12px;padding:12px;color:#1680ff;font-weight:700}
.hidden{display:none}
input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ccc;border-radius:10px;font-size:16px}
label{font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{color:#666}
.logo{max-width:180px;max-height:90px;display:block;margin-bottom:10px}
.item{border:1px solid #e1e1e1;border-radius:14px;padding:12px;margin:10px 0}
.itemline{display:grid;grid-template-columns:1.4fr .7fr .9fr .9fr auto;gap:8px;align-items:end}
.itemline input,.itemline select{margin-bottom:0}
.remove{border:0;background:#eee;border-radius:10px;padding:12px;font-weight:700}
@media(max-width:620px){.row,.itemline{grid-template-columns:1fr 1fr}.itemline .wide{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
  <div class="card head">
    <img id="logoPreview" class="logo hidden">
    <h1>FR Fliesen Rechteck</h1>
    <div class="small">Rechnung App</div>
  </div>

  <div class="tabs">
    <button class="tab" onclick="home()">Übersicht</button>
    <button class="tab" onclick="showForm('Angebot')">Angebote</button>
    <button class="tab" onclick="showForm('Rechnung')">Rechnungen</button>
    <button class="tab" onclick="settings()">Einstellungen</button>
  </div>

  <div id="home" class="card">
    <h2>Übersicht</h2>
    <button class="btn" onclick="showForm('Rechnung')">+ Neue Rechnung</button>
    <button class="btn outline" onclick="showForm('Angebot')">+ Neues Angebot</button>
  </div>

  <div id="form" class="card hidden">
    <h2 id="formTitle">Neue Rechnung</h2>

    <div class="row">
      <div><label>Nummer</label><input id="docNr" placeholder="z.B. 2026-001"></div>
      <div><label>Datum</label><input id="docDate" type="date"></div>
    </div>

    <label>Kunde</label><input id="kunde">
    <label>Adresse</label><input id="adresse">
    <label>Baustelle</label><input id="bau">

    <div class="row">
      <div>
        <label>Kundentyp</label>
        <select id="typ"><option>Firma</option><option>Privatkunde</option></select>
      </div>
      <div>
        <label>Steuer</label>
        <select id="steuer"><option value="rc">Reverse Charge</option><option value="20">20% USt.</option><option value="0">0% USt.</option></select>
      </div>
    </div>

    <h3>Positionen</h3>
    <div id="items"></div>
    <button class="btn outline" type="button" onclick="addItem()">+ Position hinzufügen</button>

    <label>Nachricht (optional)</label><textarea id="nachricht" rows="3"></textarea>

    <div class="row">
      <div><label>Zahlungsziel</label><select id="tage"><option>14</option><option>7</option><option>30</option></select></div>
      <div><label>Skonto</label><select id="skonto"><option value="3">3% / 7 Tage</option><option value="0">Kein Skonto</option></select></div>
    </div>

    <button class="btn" onclick="makeDoc()">PDF erstellen / Drucken</button>
    <button class="btn outline" onclick="home()">Zurück</button>
  </div>

  <div id="settings" class="card hidden">
    <h2>Einstellungen · Firma</h2>
    <label>Logo auswählen</label>
    <input id="logoInput" type="file" accept="image/*">
    <p class="small">Das Logo wird auf diesem iPhone gespeichert und für Rechnung/Angebot verwendet.</p>
    <button class="btn outline" onclick="home()">Zurück</button>
  </div>
</div>

<script>
let docType='Rechnung';
const H=['home','form','settings'];
const units=['m²','lfm','Std.','Stk.','Pauschal','kg'];
let itemCount=0;

function hide(){H.forEach(x=>document.getElementById(x).classList.add('hidden'))}
function home(){hide();document.getElementById('home').classList.remove('hidden')}
function showForm(t){
  docType=t;hide();document.getElementById('form').classList.remove('hidden');
  document.getElementById('formTitle').textContent=t==='Rechnung'?'Neue Rechnung':'Neues Angebot';
  if(!document.getElementById('docDate').value)document.getElementById('docDate').value=new Date().toISOString().slice(0,10);
  if(document.querySelectorAll('.item').length===0)addItem();
}
function settings(){hide();document.getElementById('settings').classList.remove('hidden')}

let logo=localStorage.getItem('frLogo')||'';
function showLogo(){let i=document.getElementById('logoPreview');if(logo){i.src=logo;i.classList.remove('hidden')}else i.classList.add('hidden')}
showLogo();

document.getElementById('logoInput').addEventListener('change',e=>{
  let f=e.target.files[0];if(!f)return;
  let r=new FileReader();
  r.onload=()=>{logo=r.result;localStorage.setItem('frLogo',logo);showLogo();alert('Logo gespeichert')};
  r.readAsDataURL(f)
});

function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function escAttr(s){return esc(s).replace(/'/g,'&#39;')}

function addItem(desc='',qty='',unit='m²',price=''){
  itemCount++;
  const box=document.createElement('div');
  box.className='item';
  box.innerHTML=`
    <div class="itemline">
      <div class="wide"><label>Beschreibung</label><input class="i-desc" value="${escAttr(desc)}" placeholder="z.B. Bodenfliesen verlegen"></div>
      <div><label>Menge</label><input class="i-qty" type="number" step="0.01" value="${qty}"></div>
      <div><label>Einheit</label><select class="i-unit">${units.map(u=>`<option ${u===unit?'selected':''}>${u}</option>`).join('')}</select></div>
      <div><label>Preis €</label><input class="i-price" type="number" step="0.01" value="${price}"></div>
      <button type="button" class="remove" onclick="this.closest('.item').remove()">✕</button>
    </div>`;
  document.getElementById('items').appendChild(box);
}

function euro(n){return new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'}).format(Number(n||0))}
function num(n){return new Intl.NumberFormat('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0))}
function fmtDate(v){if(!v)return '';const [y,m,d]=v.split('-');return d+'.'+m+'.'+y}

function collectItems(){
  return [...document.querySelectorAll('.item')].map(el=>{
    const q=parseFloat(el.querySelector('.i-qty').value)||0;
    const p=parseFloat(el.querySelector('.i-price').value)||0;
    return {desc:el.querySelector('.i-desc').value,qty:q,unit:el.querySelector('.i-unit').value,price:p,sum:q*p}
  }).filter(x=>x.desc||x.qty||x.price)
}

function makeDoc(){
  const items=collectItems();
  if(items.length===0){alert('Bitte mindestens eine Position eingeben.');return}

  const net=items.reduce((a,b)=>a+b.sum,0);
  const st=document.getElementById('steuer').value;
  const ust=st==='20'?net*.2:0;
  const total=net+ust;
  const sk=parseFloat(document.getElementById('skonto').value)||0;
  const skontoValue=total*sk/100;
  const docNr=document.getElementById('docNr').value;
  const docDate=document.getElementById('docDate').value;
  const dueDays=parseInt(document.getElementById('tage').value)||14;
  const dueDate=new Date(docDate||new Date());
  dueDate.setDate(dueDate.getDate()+dueDays);
  const due=String(dueDate.getDate()).padStart(2,'0')+'.'+String(dueDate.getMonth()+1).padStart(2,'0')+'.'+dueDate.getFullYear();

  let w=window.open('','_blank');
  if(!w){alert('Popup blockiert. Bitte Popups erlauben.');return}

  const lg=logo?`<img src="${logo}" style="max-width:190px;max-height:95px">`:`<div style="font-size:25px;font-weight:800">FR Fliesen Rechteck</div>`;
  const rows=items.map(x=>`<tr><td>${esc(x.desc)}</td><td style="text-align:right">${num(x.qty)}</td><td>${esc(x.unit)}</td><td style="text-align:right">${euro(x.price)}</td><td style="text-align:right">${euro(x.sum)}</td></tr>`).join('');

  const steuerText=st==='rc'?`<p class="note">Steuerschuldnerschaft des Leistungsempfängers gemäß § 19 Abs. 1a UStG.</p>`:'';
  const skontoText=sk>0?`<p>Zahlungsziel: ${dueDays} Tage. Bei Zahlung innerhalb 7 Tagen können ${sk}% Skonto (${euro(skontoValue)}) abgezogen werden.</p>`:`<p>Zahlungsziel: ${dueDays} Tage.</p>`;

  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${docType} ${esc(docNr)}</title>
  <style>
  body{font-family:Arial,sans-serif;padding:28px 34px;color:#222;font-size:13px}
  .top{display:flex;justify-content:space-between;gap:30px;align-items:flex-start}
  .right{text-align:right;font-size:11px;line-height:1.5}
  .redline{border:0;border-top:2px solid #c92d29;margin:18px 0}
  .meta{display:flex;justify-content:space-between;gap:20px}
  .title{font-size:26px;font-weight:800;margin:6px 0 16px}
  table{width:100%;border-collapse:collapse;margin-top:22px}
  th{background:#f3f3f3;font-weight:700}
  th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}
  .sum{margin-left:auto;width:310px;margin-top:20px}
  .sum div{display:flex;justify-content:space-between;padding:5px 0}
  .big{font-weight:800;font-size:18px;border-top:2px solid #222;margin-top:5px;padding-top:9px!important}
  .note{margin-top:22px}
  .footer{margin-top:28px;line-height:1.5}
  .printbtn{margin-top:25px;padding:12px 18px;border:0;border-radius:9px;background:#111;color:white;font-weight:700}
  @media print{.printbtn{display:none}body{padding:0}}
  </style></head><body>
  <div class="top"><div>${lg}</div><div class="right">Kamerlweg 58 · 4600 Wels<br>UID ATU79163806 · StNr. 54 347/6998<br>office@fliesen-rechteck.at · 06649277777<br>IBAN AT09 2032 0321 0067 2132<br>BIC ASPKAT2LXXX</div></div>
  <hr class="redline">
  <div class="meta">
    <div><div class="title">${docType.toUpperCase()}</div><b>Kunde:</b> ${esc(document.getElementById('kunde').value)}<br>${esc(document.getElementById('adresse').value)}<br><b>Baustelle:</b> ${esc(document.getElementById('bau').value)}</div>
    <div style="text-align:right;line-height:1.6"><b>Nr.:</b> ${esc(docNr)}<br><b>Datum:</b> ${fmtDate(docDate)}<br><b>Fällig:</b> ${due}</div>
  </div>
  <table><tr><th>Beschreibung</th><th style="text-align:right">Menge</th><th>Einheit</th><th style="text-align:right">Preis</th><th style="text-align:right">Summe</th></tr>${rows}</table>
  <div class="sum"><div><span>Netto</span><span>${euro(net)}</span></div>${ust?`<div><span>USt. 20%</span><span>${euro(ust)}</span></div>`:''}<div class="big"><span>Zahlbetrag</span><span>${euro(total)}</span></div></div>
  ${steuerText}
  ${document.getElementById('nachricht').value?`<p>${esc(document.getElementById('nachricht').value)}</p>`:''}
  <div class="footer">${skontoText}</div>
  <button class="printbtn" onclick="window.print()">PDF / Drucken</button>
  </body></html>`);
  w.document.close();
}
</script>
</body>
</html>
