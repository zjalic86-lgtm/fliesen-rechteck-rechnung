<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FR Fliesen Rechteck</title><style>body{font-family:-apple-system,Arial;background:#f4f5f7;margin:0;color:#222}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.head{border-top:6px solid #c92d29}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#c92d29;color:#fff;font-size:18px;font-weight:700;margin:7px 0}.outline{background:#fff;color:#c92d29;border:2px solid #c92d29}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;background:#fff;border:0;border-radius:12px;padding:12px;color:#1680ff;font-weight:700}.hidden{display:none}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ccc;border-radius:10px;font-size:16px}label{font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{color:#666}.logo{max-width:180px;max-height:90px;display:block;margin-bottom:10px}</style></head><body><div class="app"><div class="card head"><img id="logoPreview" class="logo hidden"><h1>FR Fliesen Rechteck</h1><div class="small">Rechnung App</div></div><div class="tabs"><button class="tab" onclick="home()">Übersicht</button><button class="tab" onclick="showForm('Angebot')">Angebote</button><button class="tab" onclick="showForm('Rechnung')">Rechnungen</button><button class="tab" onclick="settings()">Einstellungen</button></div><div id="home" class="card"><h2>Übersicht</h2><button class="btn" onclick="showForm('Rechnung')">+ Neue Rechnung</button><button class="btn outline" onclick="showForm('Angebot')">+ Neues Angebot</button></div><div id="form" class="card hidden"><h2 id="formTitle">Neue Rechnung</h2><label>Kunde</label><input id="kunde"><label>Adresse</label><input id="adresse"><label>Baustelle</label><input id="bau"><label>Kundentyp</label><select id="typ"><option>Firma</option><option>Privatkunde</option></select><label>Steuer</label><select id="steuer"><option value="rc">Reverse Charge</option><option value="20">20% USt.</option><option value="0">0% USt.</option></select><label>Beschreibung</label><input id="desc" placeholder="z.B. Bodenfliesen verlegen"><div class="row"><div><label>Menge</label><input id="menge" type="number" step="0.01"></div><div><label>Preis €</label><input id="preis" type="number" step="0.01"></div></div><label>Nachricht (optional)</label><textarea id="nachricht"></textarea><label>Zahlungsziel</label><select id="tage"><option>14</option><option>7</option><option>30</option></select><button class="btn" onclick="makeDoc()">PDF erstellen / Drucken</button><button class="btn outline" onclick="home()">Zurück</button></div><div id="settings" class="card hidden"><h2>Einstellungen · Firma</h2><label>Logo auswählen</label><input id="logoInput" type="file" accept="image/*"><p class="small">Das Logo wird auf diesem iPhone gespeichert und für Rechnung/Angebot verwendet.</p><button class="btn outline" onclick="home()">Zurück</button></div></div><script>let docType='Rechnung';const H=['home','form','settings'];function hide(){H.forEach(x=>document.getElementById(x).classList.add('hidden'))}function home(){hide();document.getElementById('home').classList.remove('hidden')}function showForm(t){docType=t;hide();document.getElementById('form').classList.remove('hidden');document.getElementById('formTitle').textContent=t==='Rechnung'?'Neue Rechnung':'Neues Angebot'}function settings(){hide();document.getElementById('settings').classList.remove('hidden')}let logo=localStorage.getItem('frLogo')||'';function showLogo(){let i=document.getElementById('logoPreview');if(logo){i.src=logo;i.classList.remove('hidden')}else i.classList.add('hidden')}showLogo();document.getElementById('logoInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{logo=r.result;localStorage.setItem('frLogo',logo);showLogo();alert('Logo gespeichert')};r.readAsDataURL(f)});function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function makeDoc(){let q=+document.getElementById('menge').value||0,p=+document.getElementById('preis').value||0,net=q*p,st=document.getElementById('steuer').value,ust=st==='20'?net*.2:0,total=net+ust;let w=window.open('','_blank');let lg=logo?'<img src="'+logo+'" style="max-width:180px;max-height:90px">':'<b style="font-size:24px">FR Fliesen Rechteck</b>';w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+docType+'</title><style>body{font-family:Arial;padding:35px;color:#222}.top{display:flex;justify-content:space-between}.right{text-align:right;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.sum{margin-left:auto;width:300px;margin-top:20px}.sum div{display:flex;justify-content:space-between;padding:5px}.big{font-weight:bold;font-size:18px}@media print{button{display:none}}</style></head><body><div class="top"><div>'+lg+'</div><div class="right">Kamerlweg 58 · 4600 Wels<br>UID ATU79163806 · StNr. 54 347/6998<br>office@fliesen-rechteck.at · 06649277777<br>IBAN AT09 2032 0321 0067 2132<br>BIC ASPKAT2LXXX</div></div><hr><h1>'+docType.toUpperCase()+'</h1><p><b>Kunde:</b> '+esc(kunde.value)+'<br>'+esc(adresse.value)+'<br><b>Baustelle:</b> '+esc(bau.value)+'</p><table><tr><th>Beschreibung</th><th>Menge</th><th>Preis</th><th>Summe</th></tr><tr><td>'+esc(desc.value)+'</td><td>'+q.toFixed(2)+'</td><td>'+p.toFixed(2)+' €</td><td>'+net.toFixed(2)+' €</td></tr></table><div class="sum"><div><span>Netto</span><span>'+net.toFixed(2)+' €</span></div>'+(ust?'<div><span>USt. 20%</span><span>'+ust.toFixed(2)+' €</span></div>':'')+'<div class="big"><span>Zahlbetrag</span><span>'+total.toFixed(2)+' €</span></div></div>'+(st==='rc'?'<p>Steuerschuldnerschaft des Leistungsempfängers gemäß § 19 Abs. 1a UStG.</p>':'')+'<p>'+esc(nachricht.value)+'</p><p>Zahlungsziel: '+esc(tage.value)+' Tage<br>3% Skonto bei Zahlung innerhalb 7 Tagen.</p><button onclick="window.print()">PDF / Drucken</button></body></html>');w.document.close()} </script></body></html>
